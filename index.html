<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8eee6">
<title>You're Invited | Abdulrahman & Nadine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');
*{box-sizing:border-box} body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 15%,#fff9f4,#f1dfd3 60%,#e8cdbd);color:#674638;font-family:'Cormorant Garamond',serif}
.cover{width:min(100%,520px);min-height:690px;border:1px solid #c79b65;border-radius:260px 260px 24px 24px;background:linear-gradient(145deg,#fffaf5,#f8e9de);box-shadow:0 20px 60px #76503b30;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:45px 28px 36px}
.cover:before,.cover:after{content:"❀";position:absolute;color:#c89b70;font-size:58px;opacity:.65}.cover:before{top:20px;left:25px}.cover:after{right:25px;bottom:20px}
.eyebrow{letter-spacing:5px;text-transform:uppercase;font-size:13px;margin:28px 0 18px;color:#9b755c}
h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(48px,12vw,72px);line-height:1.08;margin:0;color:#7d5140}
.amp{font-size:28px;color:#bd9569;margin:5px}
.rule{width:130px;height:1px;background:#c9a274;margin:24px auto}
.invite-title{font-size:23px;letter-spacing:2px;text-transform:uppercase;margin:0;color:#805e4d}
.sub{font-size:19px;margin:14px 0 30px;color:#9b7967}
.open{border:0;border-radius:40px;padding:15px 38px;background:#855a47;color:#fffaf5;font:600 17px 'Cormorant Garamond',serif;letter-spacing:1.5px;box-shadow:0 8px 20px #855a4740;cursor:pointer;transition:.2s}
.open:hover{transform:translateY(-2px);background:#704632}
.small{font-size:13px;letter-spacing:2px;color:#a48672;margin-top:auto}
.ornament{font-size:32px;color:#c39a6c;margin:12px 0}
</style>
</head>
<body>
<main class="cover">
  <div class="eyebrow">Together with our families</div>
  <div class="ornament">❦</div>
  <h1>Abdulrahman</h1><div class="amp">&amp;</div><h1>Nadine</h1>
  <div class="rule"></div>
  <p class="invite-title">Wedding Invitation</p>
  <p class="sub">We joyfully invite you to celebrate<br>the beginning of our forever.</p>
  <a href="invitation.html" style="text-decoration:none"><button class="open" type="button">OPEN INVITATION&nbsp; ♥</button></a>
  <div class="small">3 JANUARY 2027 · CAIRO</div>
</main>
</body>
</html>
