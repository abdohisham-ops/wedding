<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#261c1c">

    <title>Abdulrahman & Nadine | Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(ellipse at center, #5a4036 0%, #302323 55%, #171112 100%);
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: #f8edda;
        }

        .invitation-cover {
            position: relative;
            width: 100%;
            max-width: 650px;
            min-height: 780px;
            padding: 65px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;

            border: 1px solid #c9a45e;
            outline: 1px solid rgba(201, 164, 94, 0.4);
            outline-offset: -12px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.04),
                    transparent 45%,
                    rgba(0,0,0,0.15)
                );
        }

        .corner {
            position: absolute;
            color: #d7b878;
            font-size: 28px;
        }

        .top-left {
            top: 30px;
            left: 35px;
        }

        .top-right {
            top: 30px;
            right: 35px;
        }

        .bottom-left {
            bottom: 30px;
            left: 35px;
        }

        .bottom-right {
            bottom: 30px;
            right: 35px;
        }

        .flowers {
            color: #d7b878;
            font-size: 35px;
            letter-spacing: 12px;
            margin-bottom: 35px;
        }

        .small-title {
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #e8d4ae;
            margin-bottom: 35px;
        }

        .name {
            font-size: clamp(45px, 9vw, 75px);
            font-weight: 400;
            font-style: italic;
            line-height: 1.1;
            color: #dfbd79;
        }

        .ampersand {
            font-size: 35px;
            font-style: italic;
            color: #f8edda;
            margin: 15px 0;
        }

        .divider {
            width: 110px;
            height: 1px;
            background: #c9a45e;
            margin: 38px auto;
        }

        .invitation-text {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #eadcc5;
            margin-bottom: 30px;
        }

        .open-button {
            display: inline-block;
            padding: 17px 35px;
            border: 1px solid #d7b878;
            background: #d7b878;
            color: #261c1c;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .open-button:hover {
            background: transparent;
            color: #dfbd79;
            transform: translateY(-3px);
        }

        .footer {
            position: absolute;
            bottom: 65px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #cbb998;
        }

        @media (max-width: 500px) {
            .invitation-cover {
                min-height: 700px;
                padding: 50px 20px;
            }

            .small-title {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .footer {
                bottom: 55px;
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <main class="invitation-cover">

        <span class="corner top-left">❦</span>
        <span class="corner top-right">❦</span>
        <span class="corner bottom-left">❦</span>
        <span class="corner bottom-right">❦</span>

        <div class="flowers">❧ ❀ ❧</div>

        <p class="small-title">
            Together with our families
        </p>

        <h1 class="name">
            Abdulrahman
        </h1>

        <div class="ampersand">
            &
        </div>

        <h1 class="name">
            Nadine
        </h1>

        <div class="divider"></div>

        <p class="invitation-text">
            Request the pleasure of your company
        </p>

        <a href="invitation.html" class="open-button">
            Open Invitation
        </a>

        <div class="footer">
            A CELEBRATION OF LOVE
        </div>

    </main>

</body>
</html>
